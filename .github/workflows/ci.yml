name: test
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: go test -race -cover ./...
      - run: go vet ./...
  firmware:
    runs-on: ubuntu-latest
    container: tinygo/tinygo:0.43.0
    steps:
      - uses: actions/checkout@v4
      - run: make firmware
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/
