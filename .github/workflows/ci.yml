name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web-tinygo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: tinygo/tinygo:0.43.0
      # Actions writes runner-mounted files; the image defaults to a different UID.
      options: --user 0
    steps:
      - uses: actions/checkout@v7
      - name: Trust the mounted checkout for TinyGo VCS stamping
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache-dependency-path: |
            web/go.sum
            web/hello/go.sum
      - name: Install asset packaging runtime
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - name: Build TinyGo WASM site
        run: make web-tinygo
      - uses: actions/upload-artifact@v7
        with:
          name: web-demo-tinygo
          path: build/web/
          if-no-files-found: error
          retention-days: 14
      - name: Package Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web/
          # Keep the local asset ownership manifest out of the published site.
          include-hidden-files: false
  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [host, web, firmware, bubbletea, web-tinygo]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy browser gallery
        id: deployment
        uses: actions/deploy-pages@v5
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache-dependency-path: |
            web/go.sum
            web/hello/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test browser bridge and build WASM site
        run: make -C web test build
      - uses: actions/upload-artifact@v7
        with:
          name: web-demo
          path: build/web/
          if-no-files-found: error
          retention-days: 14
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            go.sum
            devices/terminal/go.sum
      - name: Check formatting, modules, docs, tests, and host builds
        run: make check
      - name: Check the terminal target natively and for wasip1
        run: make -C devices/terminal check
      - name: Render desktop demos
        run: make hello-preview snapshot widgets-preview tinycharts-preview
      - uses: actions/upload-artifact@v7
        with:
          name: demo-previews
          path: |
            build/hello.png
            build/hello.gif
            snapshot.png
            docs/assets/widgets/*.png
            docs/assets/tinycharts/*.png
          if-no-files-found: error
          retention-days: 14
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: tinygo/tinygo:0.43.0
      # Actions writes runner-mounted files; the image defaults to a different UID.
      options: --user 0
    steps:
      - uses: actions/checkout@v7
      - name: Trust the mounted checkout for TinyGo VCS stamping
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build all firmware with the minimum supported TinyGo
        run: make firmware
      - name: Run TinyHAL WASI smoke check
        run: make tinyhal-wasi
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            build/pico-oled.uf2
            build/pico2-oled.uf2
            build/clue.uf2
            build/esp32s3-check.elf
            build/tinytea-check.elf
            build/feather-reverse-tft.bin
          if-no-files-found: error
          retention-days: 14

  bubbletea:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: tinygo/tinygo:0.43.0
      # Actions writes runner-mounted files; the image defaults to a different UID.
      options: --user 0
    defaults:
      run:
        working-directory: bubbletea
    steps:
      - uses: actions/checkout@v7
      - name: Trust the mounted checkout for TinyGo VCS stamping
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache-dependency-path: bubbletea/go.sum
      - name: Install portability script runtime
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - name: Prepare and test Bubble Tea v2.1 adapter
        run: make prepare test
      - name: Build Bubble Tea Feather firmware
        run: make firmware
      - uses: actions/upload-artifact@v7
        with:
          name: bubbletea
          path: |
            build/bubbletea-feather.bin
            build/bubbletea-feather-settings.bin
          if-no-files-found: error
          retention-days: 14
